<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅遊登記行事曆</title>
<style>
  :root{
    --bg:#EDEFEF; --surface:#FFFFFF; --ink:#1E2A32; --ink-soft:#5B6B72;
    --line:#D7DCDC; --line-strong:#B9C2C2;
    --open:#2F7A6B; --open-bg:#E4EFEC;
    --warn:#C98A2B; --warn-bg:#FBF0DE;
    --full:#B24A3B; --full-bg:#F7E5E1;
    --info:#3D5A80; --today-ring:#1E2A32; --radius:10px;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
  .storage-banner{display:none;background:var(--warn-bg);color:var(--warn);border:1px solid #E8CB99;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}
  .storage-banner.show{display:block;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 4px;}
  h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0 0 16px;}
  .tabs{display:flex;gap:18px;margin-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab-btn{font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft);background:none;border:none;padding:9px 2px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--info);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .card h2{font-size:15px;margin:0 0 4px;}
  .card .sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;}

  .qa-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr 1fr auto auto;gap:10px;align-items:end;}
  .qa-field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .qa-field input[type=text], .qa-field input[type=date]{
    width:100%;font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  }
  .qa-field input[readonly]{background:var(--bg);color:var(--ink-soft);}
  .qa-check{display:flex;align-items:center;gap:7px;padding-bottom:9px;white-space:nowrap;}
  .qa-check input{width:16px;height:16px;}
  .qa-check label{font-size:12.5px;font-weight:600;color:var(--ink);}
  .qa-submit, .btn-primary{
    font:inherit;font-size:13.5px;font-weight:700;background:var(--info);border:1px solid var(--info);color:#fff;
    padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s;
  }
  .qa-submit:hover, .btn-primary:hover{background:#324a68;}
  .qa-hint{font-size:11.5px;color:var(--ink-soft);margin-top:10px;}
  @media (max-width:820px){ .qa-grid{grid-template-columns:1fr 1fr;} .qa-check,.qa-submit{grid-column:1/-1;} }

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px;}
  .month-nav{display:flex;align-items:center;gap:14px;}
  .month-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .month-nav button:hover{background:var(--bg);}
  .month-label{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;min-width:120px;text-align:center;}
  .toolbar-actions{display:flex;gap:8px;align-items:center;}
  .btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;}
  .btn:hover{background:var(--bg);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-danger-outline{border-color:var(--full);color:var(--full);}

  .info-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .legend-dot{width:8px;height:8px;border-radius:2px;}
  .legend-tag{font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 5px;}
  .summary-note{font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  .summary-note b{color:var(--ink);font-weight:700;}

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
  .weekday-row div{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);text-align:center;padding:4px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:108px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;}
  .day-cell:hover{border-color:var(--line-strong);box-shadow:0 2px 8px rgba(30,42,50,.08);}
  .day-cell.empty{background:transparent;border-color:transparent;cursor:default;box-shadow:none;}
  .day-cell.weekend .day-num{color:var(--ink-soft);}
  .day-cell.holiday .day-num{color:var(--full);}
  .day-cell.today{border:1.5px solid var(--today-ring);}
  .day-num{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .day-num.today-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;}
  .holiday-tag{font-family:var(--mono);font-size:11px;color:var(--full);font-weight:700;}
  .day-cell.status-warn{background:var(--warn-bg);}
  .day-cell.status-full{background:var(--full-bg);border-color:var(--full);}
  .overflow-note{font-family:var(--mono);font-size:10px;color:var(--full);font-weight:700;}
  .name-list{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;}
  .name-list .more{color:var(--info);font-weight:600;}
  .name-list .tt{color:var(--warn);}

  .overlay{position:fixed;inset:0;background:rgba(30,42,50,.28);display:none;align-items:stretch;justify-content:flex-end;z-index:50;}
  .overlay.show{display:flex;}
  .panel{width:380px;max-width:92vw;background:var(--bg);height:100%;box-shadow:-8px 0 24px rgba(30,42,50,.18);padding:24px 22px;overflow-y:auto;transform:translateX(12px);opacity:0;animation:slideIn .18s ease forwards;}
  @keyframes slideIn{to{transform:translateX(0);opacity:1;}}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .panel-date{font-size:19px;font-weight:700;}
  .panel-weekday{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:18px;}
  .close-x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-soft);padding:4px;}
  .capacity-line{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:18px;}
  .capacity-line.open{background:var(--open-bg);color:var(--open);}
  .capacity-line.warn{background:var(--warn-bg);color:var(--warn);}
  .capacity-line.full{background:var(--full-bg);color:var(--full);}
  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;}
  .person-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:13.5px;}
  .person-row .pname{font-weight:600;}
  .person-row .prange{color:var(--ink-soft);font-size:11.5px;margin-top:2px;font-family:var(--mono);}
  .pill{display:inline-block;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 6px;margin-left:6px;}
  .del-btn{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px 4px;}
  .del-btn:hover{color:var(--full);}
  .empty-state{font-size:13px;color:var(--ink-soft);padding:14px 0;text-align:center;border:1px dashed var(--line-strong);border-radius:8px;margin-bottom:16px;}
  .panel-hint{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(30,42,50,.28);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:12px;padding:24px;width:400px;max-width:100%;box-shadow:0 12px 32px rgba(30,42,50,.24);max-height:86vh;overflow-y:auto;}
  .modal h3{margin:0 0 4px;font-size:16px;}
  .modal p{margin:0 0 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .conflict-list{list-style:none;margin:0 0 4px;padding:0;}
  .conflict-list li{background:var(--warn-bg);border:1px solid #E8CB99;border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:12.5px;color:var(--ink);}
  .conflict-list li b{font-family:var(--mono);}
  .conflict-list li.full-item{background:var(--full-bg);border-color:#E3B7AC;}

  .toast-container{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .toast-container.show{display:flex;}
  .toast{background:#111827;color:#ffffff;padding:18px 28px;border-radius:12px;font-size:16px;font-weight:600;max-width:85vw;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.3);line-height:1.5;letter-spacing:0.02em;}

  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-size:13px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th, table.data-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
  table.data-table th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;}
  table.data-table td.num{font-variant-numeric:tabular-nums;font-weight:700;}
  table.data-table tr.total-row td{font-weight:700;border-top:2px solid var(--line-strong);border-bottom:none;}

  .emp-add-grid{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:end;margin-bottom:18px;}
  .emp-add-grid .qa-field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .emp-add-grid input{width:100%;font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line-strong);}
  @media (max-width:600px){.emp-add-grid{grid-template-columns:1fr;}}

  .holiday-row{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .holiday-row select{font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);}
  .holiday-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .holiday-chip{font-family:var(--mono);font-size:11px;background:var(--full-bg);color:var(--full);border-radius:5px;padding:3px 7px;display:inline-flex;align-items:center;gap:5px;}
  .holiday-chip .chip-del{border:none;background:none;color:var(--full);cursor:pointer;font-weight:700;font-size:11px;padding:0;line-height:1;opacity:.7;}
  .holiday-chip .chip-del:hover{opacity:1;}
  details.advanced{margin-top:6px;}
  details.advanced summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--info);margin-bottom:10px;}
  .advanced textarea{width:100%;min-height:100px;font:inherit;font-family:var(--mono);font-size:12px;padding:10px;border-radius:8px;border:1px solid var(--line-strong);resize:vertical;}
  
  /* 🎯 格式化編輯器工具列與美化預覽區域樣式 */
  .notice-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .notice-tool-btn{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:4px;}
  .notice-tool-btn:hover{background:var(--bg);}
  .notice-textarea{width:100%;min-height:180px;font:inherit;font-size:13.5px;line-height:1.6;padding:12px;border-radius:8px;border:1px solid var(--line-strong);resize:vertical;}
  
  .notice-preview-box{margin-top:14px;padding:16px;background:#FAFAFA;border:1px solid var(--line);border-radius:8px;font-size:14px;line-height:1.7;color:var(--ink);}
  .notice-preview-box mark{background:#FEF08A;color:#854D0E;padding:2px 5px;border-radius:4px;font-weight:600;}
  .notice-preview-box .alert-text{color:#DC2626;background:#FEE2E2;padding:2px 6px;border-radius:4px;font-weight:700;}

  @media (max-width:640px){ .day-cell{min-height:88px;padding:6px;} h1{font-size:21px;} table.data-table{font-size:12px;} }
</style>
</head>
<body>
<div id="app">
  <p class="eyebrow">登記休假總覽・共用行事曆</p>
  <h1>旅遊登記行事曆</h1>
  <div class="loading" id="loading">載入中…</div>
</div>

<div class="overlay" id="panelOverlay"><div class="panel" id="panel"></div></div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h3>登記上限設定</h3>
    <p>設定同一天最多可登記休假的人數。所有同事會看到相同的設定。</p>
    <div class="qa-field" style="margin-bottom:0;">
      <label for="maxInput">每日上限人數</label>
      <input type="text" inputmode="numeric" id="maxInput" style="width:100%;font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line-strong);">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn-primary" onclick="saveSettingsFromModal()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="conflictOverlay">
  <div class="modal">
    <h3>這段期間已經有人登記了</h3>
    <p>送出前請確認以下日期的登記狀況：</p>
    <ul class="conflict-list" id="conflictList"></ul>
    <div class="modal-actions">
      <button class="btn" onclick="cancelConflict()">返回修改</button>
      <button class="btn-primary" onclick="confirmConflict()">仍要送出登記</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer">
  <div class="toast" id="toast"></div>
</div>

<script>
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const MIN_DAYS = 3;

const DEFAULT_NOTICE = `📋 部門劃假與旅遊登記注意事項

一、 劃假基本規範與次數限制
• 人數上限：每日最多僅開放 1 人劃假。
• 年度總次數：每人每年最多登記 7 次（不論假期長短，以登記起始日之年度計算）。
• 國定假日限制：每人每年僅限 1 次登記涵蓋[hl]「國定假日」[/hl]的旅遊假（計入上述 7 次總額中）。
• 春節期間：春節期間暫停劃假，具體停止劃假日期每年另行公告。
• 劃假表截止：[alert]排班人員正式丟出劃假表後，該表涵蓋之日期即全面停止填寫與變更（劃假表單開放後，禁止再登記旅遊）。[/alert]

二、 開放登記時間與天數門檻
• 跨年度開放：每年 9 月 1 日起，開放登記下一年度之休假日（[hl]務必確定需旅遊或返鄉超過 3 天以上再行登記[/hl]）。
• 國內旅遊/一般劃假：凡連休 3 天以上（包含週六、週日及國定假日，含三天）即需寫入登記表。

三、 出國劃假與優先權規則
1. 待定狀態寫入：待定出國名單仍可寫入登記表。
2. 購票優先權：已購買機票者可優先打入[hl]「確定出國名單」[/hl]（請填入機票確實之日期）。
3. 待定協調機制：若需購買機票時該日期已有待定，則看大家各自要不要詢問待定者。
4. 前後搭假與抽籤：出國前後仍可以劃假，但若上班人數不足需一起入抽籤。`;

const YEAR_HOLIDAYS = {
  2026: [
    {date:'2026-01-01', name:'元旦'},
    {date:'2026-02-15', name:'小年夜'},
    {date:'2026-02-16', name:'除夕'},
    {date:'2026-02-17', name:'春節初一'},
    {date:'2026-02-18', name:'春節初二'},
    {date:'2026-02-19', name:'春節初三'},
    {date:'2026-02-28', name:'和平紀念日'},
    {date:'2026-04-04', name:'兒童節'},
    {date:'2026-04-05', name:'清明節'},
    {date:'2026-05-01', name:'勞動節'},
    {date:'2026-06-19', name:'端午節'},
    {date:'2026-09-25', name:'中秋節'},
    {date:'2026-09-28', name:'教師節'},
    {date:'2026-10-10', name:'國慶日'},
    {date:'2026-10-25', name:'台灣光復節'},
    {date:'2026-12-25', name:'行憲紀念日'},
  ],
  2027: [
    {date:'2027-01-01', name:'元旦'},
    {date:'2027-02-04', name:'小年夜'},
    {date:'2027-02-05', name:'除夕'},
    {date:'2027-02-06', name:'春節初一'},
    {date:'2027-02-07', name:'春節初二'},
    {date:'2027-02-08', name:'春節初三'},
    {date:'2027-02-09', name:'春節補假'},
    {date:'2027-02-10', name:'春節補假'},
    {date:'2027-02-28', name:'和平紀念日'},
    {date:'2027-03-01', name:'和平紀念日補假'},
    {date:'2027-04-04', name:'兒童節'},
    {date:'2027-04-05', name:'清明節'},
    {date:'2027-04-06', name:'兒童節補假'},
    {date:'2027-04-30', name:'勞動節補假'},
    {date:'2027-05-01', name:'勞動節'},
    {date:'2027-06-09', name:'端午節'},
    {date:'2027-09-15', name:'中秋節'},
    {date:'2027-09-28', name:'教師節'},
    {date:'2027-10-10', name:'國慶日'},
    {date:'2027-10-11', name:'國慶日補假'},
    {date:'2027-10-25', name:'台灣光復節'},
    {date:'2027-12-24', name:'行憲紀念日補假'},
    {date:'2027-12-25', name:'行憲紀念日'},
    {date:'2027-12-31', name:'元旦補假（117年）'},
  ],
};

const ALL_BUILTIN_HOLIDAYS = (() => {
  const map = new Map();
  Object.values(YEAR_HOLIDAYS).flat().forEach(h => map.set(h.date, h.name));
  return [...map.entries()].map(([date,name]) => ({date, name}));
})();

const state = {
  entries: [],      
  employees: [],    
  holidays: [],
  notice: '',
  maxPerDay: 3,
  currentDate: new Date(),
  selectedDateStr: null,
  loaded: false,
  backendAvailable: true,
  pendingSubmit: null,
  view: 'calendar',
  syncingCount: 0
};

let isUnlocked = false;

window.addEventListener('beforeunload', (e) => {
  if (state.syncingCount > 0) {
    e.preventDefault();
    e.returnValue = '資料同步中，確定要離開嗎？';
    return '資料同步中，確定要離開嗎？';
  }
});

function saveLocalCache(){
  try {
    const cacheData = {
      entries: state.entries,
      employees: state.employees,
      holidays: state.holidays,
      notice: state.notice,
      maxPerDay: state.maxPerDay
    };
    localStorage.setItem('leave_cal_cache', JSON.stringify(cacheData));
  } catch(e){}
}

function loadLocalCache(){
  try {
    const raw = localStorage.getItem('leave_cal_cache');
    if(raw){
      const data = JSON.parse(raw);
      state.entries = data.entries || [];
      state.employees = data.employees || [];
      state.holidays = data.holidays || [];
      state.notice = data.notice || '';
      state.maxPerDay = data.maxPerDay || 3;
    }
  } catch(e){}
}

function pad(n){ return String(n).padStart(2,'0'); }
function toISO(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayISO(){ const t=new Date(); return toISO(t.getFullYear(), t.getMonth(), t.getDate()); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtRange(dates){ return dates.length===1 ? dates[0] : `${dates[0]} ~ ${dates[dates.length-1]}`; }

const EXEC_URL = 'https://script.google.com/macros/s/AKfycbz77tKex7VF3Vt095CxWLZ493UzO77QoVSr5oC0MSjzr2Q1UdbROLSobb6r3AiZp7iB/exec';

function jsonp(params){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 30000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cbName]; }catch(e){}
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const qs = Object.entries({...params, callback: cbName})
      .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
      .join('&');
    script.src = EXEC_URL + '?' + qs;
    script.onerror = () => { cleanup(); reject(new Error('network error')); };
    document.body.appendChild(script);
  });
}

async function apiCall(params){
  state.syncingCount++;
  try {
    const data = await jsonp(params);
    if(!data || data.ok === false) throw new Error((data && data.error) || 'backend error');
    return data;
  } finally {
    state.syncingCount = Math.max(0, state.syncingCount - 1);
  }
}

async function refreshFromServer(){
  try{
    const data = await apiCall({action: 'getAll'});
    state.entries = (data.entries || []).map(e => ({...e, dates: Array.isArray(e.dates) ? e.dates : []}));
    state.employees = data.employees || [];
    state.holidays = (data.holidays || []).map(h => typeof h === 'string' ? {date:h, name:'國定假日'} : h);
    state.notice = data.notice || '';
    state.maxPerDay = Number(data.maxPerDay) || 3;
    state.backendAvailable = true;
    saveLocalCache();
    return true;
  }catch(e){
    state.backendAvailable = false;
    return false;
  }
}

function subsFor(dateStr){ return state.entries.filter(e => e.dates.includes(dateStr)); }
function statusFor(count){ if(count >= state.maxPerDay) return 'full'; if(count > 0 && state.maxPerDay - count === 1) return 'warn'; return 'open'; }
function holidayName(dateStr){ const h = state.holidays.find(x=>x.date===dateStr); return h ? h.name : null; }
function isHoliday(dateStr){ return holidayName(dateStr) !== null; }
function coversHoliday(sub){ return sub.dates.some(isHoliday); }

function nameForEmpId(empId){ 
  if(!empId) return null;
  const e = state.employees.find(x => x.empId.trim().toUpperCase() === empId.trim().toUpperCase()); 
  return e ? e.name : null; 
}
function displayName(sub){ return (sub.empId && nameForEmpId(sub.empId)) || sub.name || '(未命名)'; }

    if(diff >= (MIN_DAYS-1)) spanDays = diff;
  }
  const start = new Date(startVal+'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + spanDays);
  endInput.value = toISO(end.getFullYear(), end.getMonth(), end.getDate());
  endInput.dataset.forStart = startVal;

  if(typeof endInput.showPicker === 'function'){
    try{ endInput.focus(); endInput.showPicker(); }catch(e){}

function renderGrid(y, m){

    const overflow = count > state.maxPerDay ? `<div class="overflow-note">超額 +${count-state.maxPerDay}</div>` : '';
    const namesToShow = daySubs.slice(0,2).map(e=>`${escapeHtml(displayName(e))}${e.tentative?'<span class="tt">・暫</span>':''}`).join('、');
    const moreCount = daySubs.length - 2;
    const namesHtml = daySubs.length ? `<div class="name-list">${namesToShow}${moreCount>0 ? ` <span class="more">+${moreCount}</span>` : ''}</div>` : '';

function getDateRange(startStr, endStr){
  const start = new Date(startStr + 'T00:00:00');
  const end = new Date(endStr + 'T00:00:00');
  if(isNaN(start) || isNaN(end) || start > end) return null;
  const dates = []; let cur = new Date(start); let guard = 0;
  while(cur <= end && guard < 366){ dates.push(toISO(cur.getFullYear(), cur.getMonth(), cur.getDate())); cur.setDate(cur.getDate()+1); guard++; }
  return dates;
}

function computeConflicts(dates){
  return dates.map(d => ({date: d, list: subsFor(d)})).filter(x => x.list.length > 0).map(x => ({
    date: x.date,
    names: x.list.map(e => displayName(e) + (e.tentative ? '（暫定）' : '')),
    willBeFull: (x.list.length + 1) >= state.maxPerDay,
  }));
}

function handleQuickAdd(evt){
  evt.preventDefault();
  const empId = document.getElementById('qaEmpId').value.trim();
  const name = document.getElementById('qaName').value.trim();
  const start = document.getElementById('qaStart').value;
  const end = document.getElementById('qaEnd').value;
  const tentative = document.getElementById('qaTentative').checked;
  if(!empId){ showToast('請輸入員工編號'); return false; }
  if(!name){ showToast('請輸入姓名，或確認員工編號是否正確'); return false; }
  if(!start || !end){ showToast('請選擇日期'); return false; }
  const dates = getDateRange(start, end);
  if(!dates){ showToast('結束日期不能早於開始日期'); return false; }
  if(dates.length < MIN_DAYS){ showToast(`同一次登記至少需連續 ${MIN_DAYS} 天（目前只選了 ${dates.length} 天）`); return false; }

  const conflicts = computeConflicts(dates);
  if(conflicts.length > 0){
    state.pendingSubmit = {dates, empId, name, tentative};
    showConflictModal(conflicts);
  }else{
    finalizeQuickAdd(dates, empId, name, tentative);
  }
  return false;
}

async function finalizeQuickAdd(dates, empId, name, tentative){
  const cleanEmpId = empId.trim().toUpperCase();
  const tempId = 'temp_' + Date.now();
  const newEntry = { id: tempId, empId: cleanEmpId, name, dates, tentative: !!tentative, createdAt: new Date().toISOString() };
  
  state.entries.push(newEntry);
  state.myEmpId = cleanEmpId;
  try{ localStorage.setItem('my-empid', cleanEmpId); }catch(e){}
  saveLocalCache();
  renderApp();
  showToast(`⏳ 資料同步中，請稍候…`, 0);

  try{
    const res = await apiCall({action:'addEntry', empId: cleanEmpId, name, dates: dates.join(','), tentative: tentative ? '1' : '0'});
    newEntry.id = res.id;
    saveLocalCache();
    state.backendAvailable = true;
    showToast(`✅ 資料已成功同步更新！`, 3500);
  }catch(e){
    state.entries = state.entries.filter(e => e.id !== tempId);
    saveLocalCache();
    renderApp();
    showToast('❌ 登記失敗——連不上伺服器，已還原變更', 4000);
  }
}

  const {dates, empId, name, tentative} = state.pendingSubmit;

}

function exportBackup(){
  const backup = {
    kind: 'leave-calendar-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    maxPerDay: state.maxPerDay,
    entries: state.entries,
    employees: state.employees,
    holidays: state.holidays,
    notice: state.notice,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `leave-calendar-backup-${todayISO().replace(/-/g,'')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已下載備份檔案');
}

async function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('bad-format');

    const employees = Array.isArray(data.employees) ? data.employees : [];
    const entries = Array.isArray(data.entries) ? data.entries : [];
    const holidays = Array.isArray(data.holidays)
      ? data.holidays.map(h => typeof h === 'string' ? {date:h, name:'國定假日'} : h)
      : [];
    const notice = typeof data.notice === 'string' ? data.notice : null;
    const maxPerDay = Number(data.maxPerDay) > 0 ? Number(data.maxPerDay) : null;

    const proceed = confirm(
      `確定要匯入這份備份嗎？\n內容：員工 ${employees.length} 位、登記 ${entries.length} 筆、國定假日 ${holidays.length} 天\n` +
      `匯入是「合併」進現有資料（同員工編號會更新姓名、同日期的假日會更新名稱），不會刪除既有的登記，過程需要一點時間，請耐心等候。`
    );
    if(!proceed){ evt.target.value = ''; return; }

    showToast('⏳ 匯入中，請稍候…', 0);
    for(const emp of employees){
      if(emp && emp.empId) await apiCall({action:'addEmployee', empId: emp.empId, name: emp.name || ''});
    }
    for(const en of entries){
      const dates = Array.isArray(en.dates) ? en.dates.join(',') : (en.dates || '');
      if(dates) await apiCall({action:'addEntry', empId: en.empId || '', name: en.name || '', dates, tentative: en.tentative ? '1' : '0'});
    }
    if(holidays.length){
      const items = holidays.map(h => `${h.date}:${h.name || '國定假日'}`);
      for(let i=0; i<items.length; i+=25){
        await apiCall({action:'addHolidays', items: items.slice(i, i+25).join('|')});
      }
    }
    if(notice !== null) await apiCall({action:'setNotice', text: notice});
    if(maxPerDay !== null) await apiCall({action:'setMaxPerDay', value: maxPerDay});

    await refreshFromServer();
    renderApp();
    showToast('✅ 已成功匯入並同步更新！', 3500);
  }catch(e){
    showToast('❌ 匯入失敗，請確認檔案格式，或稍後再試一次', 4000);
  }
  evt.target.value = '';
}

async function handleAddEmployee(evt){
  evt.preventDefault();
  const empIdRaw = document.getElementById('empIdNew').value.trim();
  const name = document.getElementById('empNameNew').value.trim();
  if(!empIdRaw || !name){ showToast('請輸入員工編號與姓名'); return false; }
  
  const empId = empIdRaw.toUpperCase();
  const existingIndex = state.employees.findIndex(e => e.empId.trim().toUpperCase() === empId);
  const oldEmp = existingIndex >= 0 ? {...state.employees[existingIndex]} : null;
  
  if(existingIndex >= 0){
    state.employees[existingIndex].name = name;
  } else {
    state.employees.push({empId, name});
  }
  saveLocalCache();
  renderApp();
  showToast('⏳ 員工資料同步中，請稍候…', 0);

  try{
    await apiCall({action:'addEmployee', empId, name});
    state.backendAvailable = true;
    showToast('✅ 員工資料已成功同步更新！', 3500);
  }catch(e){
    if(oldEmp){
      state.employees[existingIndex] = oldEmp;
    } else {
      state.employees = state.employees.filter(e=>e.empId!==empId);
    }
    saveLocalCache();
    renderApp();
    showToast('❌ 新增／更新失敗——連不上伺服器，已還原變更', 4000);
  }
  return false;
}

async function removeEmployee(empIdRaw){
  const empId = empIdRaw.trim().toUpperCase();
  const originalEmp = [...state.employees];
  state.employees = state.employees.filter(e => e.empId.trim().toUpperCase() !== empId);
  saveLocalCache();
  renderApp();
  showToast('⏳ 刪除同步中，請稍候…', 0);

  try{
    await apiCall({action:'removeEmployee', empId});
    state.backendAvailable = true;
    showToast('✅ 已刪除並同步更新！', 3500);
  }catch(e){
    state.employees = originalEmp;
    saveLocalCache();
    renderApp();
    showToast('❌ 刪除失敗——連不上伺服器，已還原該員工', 4000);
  }
}

function mergeHolidaysLocal(list){
  const map = new Map(state.holidays.map(h=>[h.date, h.name]));
  list.forEach(h => map.set(h.date, h.name));
  state.holidays = [...map.entries()].map(([date,name]) => ({date,name}));
}

async function fetchAndApplyYear(){
  const year = document.getElementById('holidayYear').value;
  const btn = document.getElementById('fetchBtn');
  if(btn){ btn.disabled = true; btn.textContent = '抓取中…'; }
  showToast('⏳ 抓取並同步資料中，請稍候…', 0);
  try{
    const url = `https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${year}.json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('http-'+res.status);
    const data = await res.json();
    const list = data.filter(d=>d.isHoliday).map(d=>{
      const s = String(d.date);
      return {
        date: `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`,
        name: (d.description && d.description.trim()) ? d.description.trim() : '國定假日',
      };
    });
    if(list.length===0) throw new Error('empty');
    const items = list.map(h => `${h.date}:${h.name}`).join('|');
    await apiCall({action:'addHolidays', items});
    mergeHolidaysLocal(list);
    saveLocalCache();
    state.backendAvailable = true;
    showToast(`✅ 已自動抓取並成功同步 ${year} 年國定假日！`, 3500);
  }catch(e){
    showToast(`❌ 自動抓取失敗——${year} 年資料可能還沒公開，或網路受限`, 4000);
  }
  renderApp();
}

async function removeHoliday(dateStr){
  const y = parseInt(dateStr.slice(0,4),10);
  if(y >= new Date().getFullYear()){ showToast('今年與未來年度的資料不提供逐筆刪除'); return; }
  showToast('⏳ 刪除同步中，請稍候…', 0);
  try{
    await apiCall({action:'removeHoliday', date: dateStr});
    state.holidays = state.holidays.filter(h => h.date !== dateStr);
    saveLocalCache();
    state.backendAvailable = true;
    showToast(`✅ 已成功刪除 ${dateStr} 並同步更新！`, 3500);
  }catch(e){
    showToast('❌ 刪除失敗——連不上伺服器，請稍等一下再試一次', 4000);
  }
  renderApp();
}

async function saveHolidaysManual(){
  const raw = document.getElementById('holidayTextarea').value;
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const parsed = [];
  let badCount = 0;
  lines.forEach(line => {
    const [datePart, ...nameParts] = line.split(',');
    const d = (datePart || '').trim();
    const n = nameParts.join(',').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)){ parsed.push({date: d, name: n || '國定假日'}); }
    else { badCount++; }
  });
  if(badCount > 0){ showToast(`有 ${badCount} 行格式不正確，已略過`); }
  showToast('⏳ 清單同步中，請稍候…', 0);
  try{
    await apiCall({action:'clearHolidays'});
    if(parsed.length){
      const items = parsed.map(h => `${h.date}:${h.name}`).join('|');
      await apiCall({action:'addHolidays', items});
    }
    state.holidays = parsed;
    saveLocalCache();
    state.backendAvailable = true;
    showToast('✅ 國定假日清單已成功更新並同步！', 3500);
  }catch(e){
    showToast('❌ 更新失敗——連不上伺服器，請稍等一下再試一次', 4000);
  }
  renderApp();
}

function parseFormattedText(text){
  let html = escapeHtml(text || '');
  html = html.replace(/\[b\]([\s\S]*?)\[\/b\]/g, '<b>$1</b>');
  html = html.replace(/\[hl\]([\s\S]*?)\[\/hl\]/g, '<mark>$1</mark>');
  html = html.replace(/\[alert\]([\s\S]*?)\[\/alert\]/g, '<span class="alert-text">$1</span>');
  return html.replace(/\n/g, '<br>');
}

function insertNoticeTag(tagStart, tagEnd){
  const textarea = document.getElementById('noticeTextarea');
  if(!textarea) return;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const val = textarea.value;
  const selectedText = val.substring(start, end);
  const replacement = tagStart + selectedText + tagEnd;
  textarea.value = val.substring(0, start) + replacement + val.substring(end);
  textarea.focus();
  textarea.setSelectionRange(start + tagStart.length, start + tagStart.length + selectedText.length);
  updateNoticePreview();
}

function updateNoticePreview(){
  const textarea = document.getElementById('noticeTextarea');
  const preview = document.getElementById('noticePreview');
  if(textarea && preview){
    preview.innerHTML = parseFormattedText(textarea.value);
  }
}

function computeStatsRows(year){
  const map = {};
  state.employees.forEach(emp=>{ 
    const key = emp.empId.trim().toUpperCase();
    map[key] = {empId: emp.empId.toUpperCase(), name: emp.name, confirmed:0, tentative:0, holiday:0}; 
  });
  state.entries.forEach(sub=>{
    const startYear = parseInt(sub.dates[0].slice(0,4), 10);
    if(startYear !== year) return;
    const subEmpUpper = sub.empId ? sub.empId.trim().toUpperCase() : '';
    const matched = subEmpUpper && state.employees.some(e=>e.empId.trim().toUpperCase()===subEmpUpper);
    const key = matched ? subEmpUpper : ('~' + (sub.name || subEmpUpper || '未命名'));
    if(!map[key]) map[key] = {empId: matched ? subEmpUpper : (subEmpUpper||''), name: sub.name || '(未命名)', confirmed:0, tentative:0, holiday:0};
    if(sub.tentative) map[key].tentative += 1;
    else { map[key].confirmed += 1; if(coversHoliday(sub)) map[key].holiday += 1; }
  });
  return Object.values(map).sort((a,b)=> b.confirmed - a.confirmed || (a.empId||'').localeCompare(b.empId||''));
}

      <h2>登記統計（${year} 年度）</h2>
      <p class="sub">只計算「開始日期」落在 ${year} 年度的登記——例如 2026/12/27 ~ 2027/01/10 這種跨年度的登記，會整筆算在 2026 年度（以開始日期為準），跨到的國定假日也一併算在這一年；每年會自動重新統計。「已確定登記次數」只算已確定（未刪除、未勾選暫定）的筆數，每一次登記（不論涵蓋幾天）算一次，姓名會依「員工設定」頁面自動更新。</p>
      <table class="data-table">
        <thead><tr><th>員工編號</th><th>姓名</th><th>已確定登記次數</th><th>涵蓋國定假日次數</th><th>暫定中（不列入統計）</th></tr></thead>
        <tbody>
          ${rowsHtml}
          ${rows.length ? `<tr class="total-row"><td colspan="2">總計</td><td class="num">${totals.confirmed}</td><td class="num">${totals.holiday}</td><td class="num">${totals.tentative}</td></tr>` : ''}
        </tbody>
      </table>
    </div>
  `;

  updateNoticePreview();
}

async function saveNotice(){
  const text = document.getElementById('noticeTextarea').value;
  const oldNotice = state.notice;
  state.notice = text;
  saveLocalCache();
  showToast('⏳ 公告同步中，請稍候…', 0);

  try{
    await apiCall({action:'setNotice', text});
    state.backendAvailable = true;
    showToast('✅ 注意事項已成功更新並同步！', 3500);
  }catch(e){
    state.notice = oldNotice;
    saveLocalCache();
    renderApp();
    showToast('❌ 更新失敗——連不上伺服器，已還原公告', 4000);
  }
}

init();
</script>
</body>
</html>
